<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMIMS CET 120/120 | AI/ML Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #000000; color: #ffffff; overflow-x: hidden; }
        .math-card { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .math-card:hover { border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.1); }
        .accent-text { color: #f59e0b; }
        .accent-bg { background-color: #f59e0b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Mapped exactly to the provided NMIMS CET PDF Item Counts
        const SYLLABUS = [
            { id: 1, title: "Mathematics", total: 30, chapters: [
                { name: "Algebra & Prob", marks: 14, items: ["Sets & Functions (3)", "Complex & Quad (3)", "Matrices & Det (2)", "Perm & Comb (2)", "Binomial Theorem (2)", "Math Induction (1)", "Seq & Series (1)"] },
                { name: "Calculus", marks: 5, items: ["Limit, Cont & Diff (3)", "Integral Calculus (2)"] },
                { name: "Geometry & Vectors", marks: 6, items: ["Coordinate Geometry (3)", "Vector Algebra (2)", "3D Geometry (1)"] },
                { name: "Trig & Stats", marks: 5, items: ["Statistics & Prob (3)", "Trigonometry (2)"] }
            ]},
            { id: 2, title: "Physics", total: 30, chapters: [
                { name: "Mechanics", marks: 10, items: ["Kinematics (2)", "Laws of Motion (3)", "Rotational Motion (2)", "Work, Energy, Power (1)", "Gravitation (1)", "Solids & Liquids (1)"] },
                { name: "Electromagnetism", marks: 8, items: ["Magnetic Effects (2)", "EMI & AC (2)", "EM Waves (2)", "Electrostatics (1)", "Current Electricity (1)"] },
                { name: "Heat & Waves", marks: 6, items: ["Thermodynamics (3)", "Oscillations & Waves (2)", "Kinetic Theory (1)"] },
                { name: "Optics & Modern", marks: 6, items: ["Optics (3)", "Electronic Devices (2)", "Physics & Measurement (1)"] }
            ]},
            { id: 3, title: "Chemistry", total: 30, chapters: [
                { name: "Physical Chem", marks: 10, items: ["Basic Concepts/States (2)", "Solutions & Eq. (2)", "Chemical Bonding (2)", "Thermodynamics (2)", "Atomic Structure (1)", "Redox & Electro (1)"] },
                { name: "Organic Chem", marks: 10, items: ["Hydrocarbons (2)", "Halogens/O2/N2 comps (2)", "Everyday Life (2)", "Practical Chem (2)", "Purification (1)", "Polymers (1)"] },
                { name: "Inorganic Chem", marks: 10, items: ["Periodicity (2)", "s-Block Elements (2)", "p, d, f-Block (2)", "Metallurgy (2)", "Co-ordination (1)", "Environmental (1)"] }
            ]},
            { id: 4, title: "Intelligence & Language", total: 30, chapters: [
                { name: "Logical Reasoning", marks: 10, items: ["Decision Making (5)", "Verbal-logical (5)"] },
                { name: "Data & Quant Logic", marks: 10, items: ["Problem Solving (5)", "Numerical/Venn/DI (5)"] },
                { name: "English: Grammar", marks: 4, items: ["Error Recognition (2)", "Applied Grammar (2)"] },
                { name: "English: Reading", marks: 6, items: ["Reading Comprehension (4)", "Contextual Usage (1)", "Sequencing of Ideas (1)"] }
            ]}
        ];

        function App() {
            const [progress, setProgress] = useState(() => {
                const saved = localStorage.getItem('nmims_120_tracker');
                return saved ? JSON.parse(saved) : {};
            });

            useEffect(() => {
                localStorage.setItem('nmims_120_tracker', JSON.stringify(progress));
                if (window.lucide) window.lucide.createIcons();
            }, [progress]);

            const toggle = (chapter, item) => {
                const id = `${chapter}-${item}`;
                setProgress(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const stats = useMemo(() => {
                let currentScore = 0;
                let totalItems = 0;
                let doneItems = 0;

                SYLLABUS.forEach(section => {
                    let sectionTotalItems = 0;
                    let sectionDoneItems = 0;
                    section.chapters.forEach(ch => {
                        sectionTotalItems += ch.items.length;
                        ch.items.forEach(item => {
                            totalItems++;
                            if (progress[`${ch.name}-${item}`]) {
                                sectionDoneItems++;
                                doneItems++;
                            }
                        });
                    });
                    // Proportional scoring based on exact item counts
                    currentScore += (sectionDoneItems / sectionTotalItems) * section.total;
                });

                return {
                    score: currentScore.toFixed(1),
                    percent: Math.round((doneItems / totalItems) * 100) || 0,
                    tasks: `${doneItems}/${totalItems}`
                };
            }, [progress]);

            return (
                <div className="min-h-screen p-4 md:p-12 max-w-7xl mx-auto">
                    <header className="mb-20">
                        <div className="flex flex-col md:flex-row justify-between items-end gap-8">
                            <div className="text-left">
                                <div className="inline-block px-3 py-1 rounded-md bg-amber-500/10 border border-amber-500/20 text-amber-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-4">
                                    Target: AI / Machine Learning
                                </div>
                                <h1 className="text-6xl md:text-8xl font-bold tracking-tighter leading-none">
                                    NMIMS<br/><span className="accent-text">120/120</span>
                                </h1>
                            </div>
                            
                            <div className="flex gap-4 w-full md:w-auto">
                                <div className="math-card p-6 rounded-2xl flex-1 md:w-40">
                                    <p className="text-slate-500 text-[9px] uppercase font-bold tracking-widest mb-1">Score Est.</p>
                                    <p className="text-4xl font-bold accent-text tabular-nums">{Math.round(stats.score)}<span className="text-xs text-slate-700 ml-1">/120</span></p>
                                </div>
                                <div className="math-card p-6 rounded-2xl flex-1 md:w-40 border-l-4 border-l-amber-500">
                                    <p className="text-slate-500 text-[9px] uppercase font-bold tracking-widest mb-1">Coverage</p>
                                    <p className="text-4xl font-bold tabular-nums">{stats.percent}%</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 gap-16">
                        {SYLLABUS.map(section => (
                            <div key={section.title} className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="flex items-baseline gap-4 mb-8">
                                    <h2 className="text-3xl font-bold tracking-tight">{section.title}</h2>
                                    <span className="text-amber-500/50 font-medium text-sm">Weightage: {section.total} Marks</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {section.chapters.map(ch => (
                                        <div key={ch.name} className="math-card p-6 rounded-3xl flex flex-col">
                                            <h3 className="text-sm font-bold text-slate-200 mb-6 flex items-start justify-between min-h-[40px]">
                                                {ch.name}
                                                {ch.marks > 0 && <span className="text-[9px] bg-white/5 px-2 py-0.5 rounded ml-2 whitespace-nowrap">{ch.marks}M</span>}
                                            </h3>
                                            <div className="space-y-2">
                                                {ch.items.map(item => {
                                                    const isDone = progress[`${ch.name}-${item}`];
                                                    return (
                                                        <button 
                                                            key={item}
                                                            onClick={() => toggle(ch.name, item)}
                                                            className={`w-full text-left p-3 rounded-xl flex items-center gap-3 text-[11px] font-medium transition-all ${isDone ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20' : 'bg-white/[0.02] text-slate-500 border border-transparent hover:bg-white/[0.05]'}`}
                                                        >
                                                            <div className={`w-3.5 h-3.5 rounded-sm border flex items-center justify-center transition-all ${isDone ? 'bg-amber-500 border-amber-500' : 'border-slate-800'}`}>
                                                                {isDone && <i data-lucide="check" className="text-black" style={{width: 10, height: 10}}></i>}
                                                            </div>
                                                            <span className="leading-snug">{item}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <footer className="mt-32 pb-16 border-t border-white/5 pt-12 flex flex-col md:flex-row justify-between items-center gap-4 text-slate-600">
                        <p className="text-[10px] uppercase tracking-[0.5em] font-bold">Project Eira • Optimization Phase</p>
                        <p className="text-xs italic">Data saves locally to your browser.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
